name: Injury check

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 min (GitHub may run it a few minutes late)
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      test:
        description: "Send a test alert to Telegram instead of a normal check"
        type: boolean
        default: false

permissions:
  contents: write  # to commit state.json back
  actions: read    # to see whether the previous run also failed

concurrency:
  group: injury-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # the daily digest takes a few minutes on a full slate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py ${{ inputs.test && 'test' || 'once' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_STATUSES: Out
          MIN_OWNED: "20"
          MY_PLAYERS: ""  # extra players to always treat as yours, comma separated
          MY_TEAMS: "Berkay BiggerBalls,ETAspor"  # your fantasy teams as named in the league, comma separated
          YAHOO_LEAGUE_ID: "102934"  # rosters are read from the league's public pages
          ROSTER_HOURS: "3"  # how often to re-read them
          NEWS_UPDATES: "true"
          ALERT_ON_RETURN: "true"
          SUGGESTIONS: "3"
          DIGEST_LEAD_HOURS: "6"  # daily digest this long before the first game, 0 turns it off
      - name: Save state
        if: ${{ !cancelled() }}  # a failed alert still saves the alerts that did go out
        run: |
          git config user.name "injury-bot"
          git config user.email "injury-bot@users.noreply.github.com"
          git add state.json digest.json rosters.json
          git diff --cached --quiet || git commit -m "Update injury state" && git push
      - name: Tell Telegram the check failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only the first failure of a streak, so an ESPN outage doesn't message every 5 minutes.
          last=$(gh run list --workflow check.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion' || true)
          if [ "$last" != "failure" ]; then
            curl -sS --fail -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=🛑 Injury check failed, alerts may be delayed until it recovers: $RUN_URL"
          fi
